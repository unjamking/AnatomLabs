services:
  - type: web
    name: anatomlabs-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev --workspaces=false && ./node_modules/.bin/prisma generate && ./node_modules/.bin/tsc -p tsconfig.json
    startCommand: ./node_modules/.bin/prisma db push --accept-data-loss && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
