services:
  - type: web
    name: anatomlabs-backend
    runtime: node
    rootDir: .
    buildCommand: npm --prefix backend install --include=dev && npx --prefix backend prisma generate --schema backend/prisma/schema.prisma && npx --prefix backend tsc -p backend/tsconfig.json
    startCommand: npx --prefix backend prisma db push --accept-data-loss --schema backend/prisma/schema.prisma && node backend/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
